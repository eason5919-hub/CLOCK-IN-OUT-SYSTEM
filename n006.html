<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#17211f" />
    <title>Warehouse Attendance Management</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css?v=20260824-qr-stable" />
  </head>
  <body>
    <main id="app" class="app"></main>
    <script>
      (function () {
        var key = "warehouse-device-fingerprint";
        var cookie = "warehouse-device-fingerprint";
        var prefix = "phone-n006-";

        function readCookie() {
          var rows = document.cookie ? document.cookie.split("; ") : [];
          for (var index = 0; index < rows.length; index += 1) {
            if (rows[index].indexOf(cookie + "=") === 0) {
              return decodeURIComponent(rows[index].split("=").slice(1).join("="));
            }
          }
          return "";
        }

        function createFingerprint() {
          if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
            return prefix + globalThis.crypto.randomUUID();
          }
          return prefix + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
        }

        function saveFingerprint(value) {
          localStorage.setItem(key, value);
          sessionStorage.setItem(key, value);
          document.cookie = cookie + "=" + encodeURIComponent(value) + "; Max-Age=315360000; Path=/; SameSite=Lax; Secure";
        }

        var existing = localStorage.getItem(key) || sessionStorage.getItem(key) || readCookie();
        var fingerprint = existing && existing.indexOf(prefix) === 0 ? existing : createFingerprint();
        saveFingerprint(fingerprint);
        window.__N006_DEVICE_FINGERPRINT__ = fingerprint;
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/jsqr@1.4.0/dist/jsQR.js';document.head.appendChild(s);"></script>
    <script src="script.js?v=20260824-qr-stable"></script>
    <script>
      (function () {
        var fingerprint = window.__N006_DEVICE_FINGERPRINT__;
        if (!fingerprint) return;
        window.getDeviceFingerprint = function () {
          localStorage.setItem("warehouse-device-fingerprint", fingerprint);
          sessionStorage.setItem("warehouse-device-fingerprint", fingerprint);
          document.cookie =
            "warehouse-device-fingerprint=" +
            encodeURIComponent(fingerprint) +
            "; Max-Age=315360000; Path=/; SameSite=Lax; Secure";
          return fingerprint;
        };
      })();
    </script>
  </body>
</html>
